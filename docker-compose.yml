version: '3.8'

services:
  erp:
    build: .
    container_name: latuns_erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@db:5432/latuns
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_NAME=${NODE_NAME}
      - NODE_ROLE=${NODE_ROLE}
      - PEER_NODE_ADDRESS=${PEER_NODE_ADDRESS:-}
    depends_on:
      - db
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./upload:/app/upload

  db:
    image: postgres:15-alpine
    container_name: latuns_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=latuns
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
