version: '3.8'

services:
  erp:
    build: .
    container_name: latuns_erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/latuns.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_NAME=${NODE_NAME}
      - NODE_ROLE=${NODE_ROLE}
      - PEER_NODE_ADDRESS=${PEER_NODE_ADDRESS:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./upload:/app/upload
